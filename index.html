<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos AEE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-light">
<div class="container py-3" style="max-width:900px">
  <h4 class="mb-3">Documentos do AEE</h4>

  <div class="card mb-3"><div class="card-body">
    <label class="form-label fw-bold">Estudantes salvos</label>
    <div class="input-group">
      <select id="listaAlunos" class="form-select"></select>
      <button class="btn btn-outline-primary" onclick="carregarAluno()">Abrir</button>
      <button class="btn btn-outline-secondary" onclick="novoAluno()">Novo</button>
      <button class="btn btn-outline-danger" onclick="excluirAluno()">Excluir</button>
    </div>
  </div></div>

  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabCadastro">Cadastro</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabTermo">Termo de Matrícula</button></li>
    <li class="nav-item"><button class="nav-link disabled">Info. iniciais</button></li>
    <li class="nav-item"><button class="nav-link disabled">Estudo de caso</button></li>
    <li class="nav-item"><button class="nav-link disabled">PAEE</button></li>
  </ul>

  <div class="tab-content border border-top-0 bg-white p-3">
    <!-- CADASTRO -->
    <div class="tab-pane fade show active" id="tabCadastro">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Unidade escolar</label>
          <select id="escola" class="form-select" onchange="aoMudarEscola()"></select>
        </div>
        <div class="col-md-6"><label class="form-label">Município</label><input id="cidade" class="form-control" readonly></div>
        <div class="col-md-6"><label class="form-label">Diretor(a)</label><input id="diretor" class="form-control"></div>
        <div class="col-12"><label class="form-label">Nome do estudante</label><input id="nome" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">ID</label><input id="idAluno" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Data de nascimento</label><input id="nasc" type="date" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Ano letivo</label><input id="anoLetivo" class="form-control" value="2026"></div>
        <div class="col-md-3"><label class="form-label">Série/Ano</label><input id="serie" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Turma</label><input id="turma" class="form-control"></div>
        <div class="col-md-3"><label class="form-label">Turno</label>
          <select id="turno" class="form-select"><option>Matutino</option><option>Vespertino</option><option>Noturno</option><option>Integral</option></select></div>
        <div class="col-md-3"><label class="form-label">Ensino</label>
          <select id="ensino" class="form-select"><option>Fundamental</option><option>Médio</option><option>EJA</option></select></div>
        <div class="col-md-6"><label class="form-label">Professor especializado</label><input id="prof" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Pedagoga</label><input id="pedagoga" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Tipo de atendimento</label>
          <select id="tipoAtend" class="form-select"><option>Regular</option><option>AH/SD</option></select></div>
      </div>
      <button class="btn btn-primary mt-3" onclick="salvarAluno()">Salvar estudante</button>
    </div>

    <!-- TERMO -->
    <div class="tab-pane fade" id="tabTermo">
      <div class="row g-3">
        <div class="col-12"><label class="form-label">Nome do responsável</label><input id="responsavel" class="form-control"></div>
        <div class="col-12">
          <label class="form-label d-block">Dias da semana (AEE no contraturno)</label>
          <div id="dias" class="d-flex gap-3 flex-wrap"></div>
        </div>
        <div class="col-md-6"><label class="form-label">Horário</label><input id="horario" class="form-control" placeholder="ex.: 13h às 14h30"></div>
        <div class="col-md-6"><label class="form-label">Cidade (local da assinatura)</label><input id="cidadeAssin" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Data</label><input id="dataTermo" type="date" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Opção do responsável</label>
          <select id="opcaoTermo" class="form-select">
            <option value="aceita">Comprometo-me a trazer o estudante</option>
            <option value="dispensa">Dispenso o serviço</option>
          </select></div>
        <div class="col-12" id="boxMotivo" style="display:none">
          <label class="form-label">Motivos da dispensa</label><textarea id="motivo" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <button class="btn btn-success mt-3" onclick="pdfTermo()">Baixar PDF do Termo</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const ESCOLAS = {
  "CEEFMTI Afonso Cláudio": {city:"Afonso Cláudio", director:"Allan Dyoni Dehete Many"},
  "CEEFMTI Elisa Paiva": {city:"Conceição do Castelo", director:"Rosangela Vargas Davel Pinto"},
  "EE Ivana Casagrande Scabelo": {city:"Venda Nova do Imigrante", director:"Maristela Broedel"},
  "EE Severino Paste": {city:"Venda Nova do Imigrante", director:"Maristela Broedel"},
  "EEEFM Alto Rio Possmoser": {city:"Santa Maria de Jetibá", director:"Adriana da Conceição Tesch"},
  "EEEFM Álvaro Castelo": {city:"Brejetuba", director:"Rose Fabrícia Moretto"},
  "EEEFM Domingos Perim": {city:"Venda Nova do Imigrante", director:"Maristela Broedel"},
  "EEEFM Elvira Barros": {city:"Afonso Cláudio", director:"Andrea Gomes Klug"},
  "EEEFM Fazenda Camporês": {city:"Brejetuba", director:"Emerson Ungarato"},
  "EEEFM Fazenda Emílio Schroeder": {city:"Santa Maria de Jetibá", director:"Jorge Schneider"},
  "EEEFM Fioravante Caliman": {city:"Venda Nova do Imigrante", director:"Celina Januário Moreira"},
  "EEEFM Frederico Boldt": {city:"Santa Maria de Jetibá", director:"David Felberg"},
  "EEEFM Gisela Salloker Fayet": {city:"Domingos Martins", director:"Maxwel Augusto Neves"},
  "EEEFM Graça Aranha": {city:"Santa Maria de Jetibá", director:"Camilo Pauli Dominicini"},
  "EEEFM Joaquim Caetano de Paiva": {city:"Laranja da Terra", director:"Miriam Klitzke Seibel"},
  "EEEFM José Cupertino": {city:"Afonso Cláudio", director:"Cléria Pagotto Ronchi Zanelato"},
  "EEEFM José Giestas": {city:"Afonso Cláudio", director:"Gederson Vargas Dazilio"},
  "EEEFM José Roberto Christo": {city:"Afonso Cláudio", director:"Andressa Silva Dias"},
  "EEEFM Leogildo Severiano de Souza": {city:"Brejetuba", director:"Adalberto Carlos Araújo Chaves"},
  "EEEFM Luiz Jouffroy": {city:"Laranja da Terra", director:"Nilza Abel Gumz"},
  "EEEFM Maria de Abreu Alvim": {city:"Afonso Cláudio", director:"Maria das Graças Fabio Costa"},
  "EE Mário Bergamin": {city:"Venda Nova do Imigrante", director:"Celina Januário Moreira"},
  "EEEFM Marlene Brandão": {city:"Brejetuba", director:"Paulynne Ayres Tatagiba Gonçalves"},
  "EEEFM Pedra Azul": {city:"Domingos Martins", director:"Elizabeth Drumond Ambrósio Filgueiras"},
  "EEEFM Ponto do Alto": {city:"Domingos Martins", director:"Marcelo Ribett"},
  "EEEFM Profª Aldy Soares Merçon Vargas": {city:"Conceição do Castelo", director:"Israel Augusto Moreira Borges"},
  "EEEFM Prof Hermann Berger": {city:"Santa Maria de Jetibá", director:"Eliane Raasch Bicalho"},
  "EEEFM São Jorge": {city:"Brejetuba", director:"Jormi Maria da Silva"},
  "EEEFM São Luís": {city:"Santa Maria de Jetibá", director:"Valdirene Mageski Cordeiro Magri"},
  "EEEFM Teófilo Paulino": {city:"Domingos Martins", director:"Delfina Schneider Stein"},
  "EEEM Francisco Guilherme": {city:"Santa Maria de Jetibá", director:"Jonatas André Drescher"},
  "EEEM Mata fria": {city:"Afonso Cláudio", director:"Jonatas André Drescher"},
  "EEEFM Tutorial Teste": {city:"Afonso Cláudio", director:"Diretor Teste"},
  "EEEM Sobreiro": {city:"Laranja da Terra", director:"Jonatas André Drescher"}
};
const DIAS = ["SEG","TER","QUA","QUI","SEX"];
const KEY = "aee_alunos";
const CAMPOS = ["escola","cidade","diretor","nome","idAluno","nasc","anoLetivo","serie","turma","turno","ensino","prof","pedagoga","tipoAtend",
  "responsavel","horario","cidadeAssin","dataTermo","opcaoTermo","motivo"];
const $ = id => document.getElementById(id);
let atualId = null;

// init
$("escola").innerHTML = '<option value="">Selecione...</option>' +
  Object.keys(ESCOLAS).sort((a,b)=>a.localeCompare(b,'pt')).map(e=>`<option>${e}</option>`).join("");
$("dias").innerHTML = DIAS.map(d=>`<div class="form-check"><input class="form-check-input dia" type="checkbox" value="${d}" id="d${d}"><label class="form-check-label" for="d${d}">${d}</label></div>`).join("");
$("opcaoTermo").onchange = () => $("boxMotivo").style.display = $("opcaoTermo").value==="dispensa" ? "" : "none";

function aoMudarEscola(){
  const e = ESCOLAS[$("escola").value];
  $("cidade").value = e ? e.city : "";
  $("diretor").value = e ? e.director : "";
  if (e && !$("cidadeAssin").value) $("cidadeAssin").value = e.city;
}
function lerAlunos(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function gravar(o){ try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){ alert("Não foi possível salvar."); } }
function atualizarLista(){
  const a = lerAlunos();
  $("listaAlunos").innerHTML = '<option value="">— selecione —</option>' +
    Object.entries(a).map(([id,v])=>`<option value="${id}" ${id===atualId?"selected":""}>${v.nome||"(sem nome)"}</option>`).join("");
}
function coletar(){
  const o = {}; CAMPOS.forEach(c=>o[c]=$(c).value);
  o.dias = [...document.querySelectorAll(".dia:checked")].map(x=>x.value);
  return o;
}
function preencher(o){
  CAMPOS.forEach(c=>$(c).value = o[c] ?? ($(c).tagName==="SELECT" ? $(c).options[0]?.value : ""));
  document.querySelectorAll(".dia").forEach(x=>x.checked = (o.dias||[]).includes(x.value));
  $("boxMotivo").style.display = $("opcaoTermo").value==="dispensa" ? "" : "none";
}
function salvarAluno(){
  const d = coletar();
  if(!d.nome.trim()) return alert("Informe o nome do estudante.");
  const a = lerAlunos();
  if(!atualId) atualId = "a" + Date.now();
  a[atualId] = d; gravar(a); atualizarLista(); alert("Estudante salvo.");
}
function carregarAluno(){
  const id = $("listaAlunos").value; if(!id) return;
  atualId = id; preencher(lerAlunos()[id]);
}
function novoAluno(){ atualId = null; preencher({anoLetivo:"2026"}); $("listaAlunos").value=""; }
function excluirAluno(){
  const id = $("listaAlunos").value; if(!id || !confirm("Excluir este estudante?")) return;
  const a = lerAlunos(); delete a[id]; gravar(a); if(atualId===id) novoAluno(); atualizarLista();
}

// ---------- PDF ----------
function cabecalho(doc){
  const W = doc.internal.pageSize.getWidth();
  doc.setFont("helvetica","bold"); doc.setFontSize(9);
  ["GOVERNO DO ESTADO DO ESPÍRITO SANTO","SECRETARIA DE ESTADO DA EDUCAÇÃO",
   "SUBSECRETARIA DE EDUCAÇÃO, BÁSICA E PROFISSIONAL",
   "GERÊNCIA DE EDUCAÇÃO ESPECIAL NA PERSPECTIVA DA EDUCAÇÃO INCLUSIVA"]
   .forEach((t,i)=>doc.text(t, W/2, 18+i*4.5, {align:"center"}));
  return 42;
}
function fmtData(v){ if(!v) return "____/____/______"; const [y,m,d]=v.split("-"); return `${d}/${m}/${y}`; }
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function sub(t){ return t && t.trim() ? t : "____________________"; }

function pdfTermo(){
  const d = coletar();
  if(!d.nome.trim()) return alert("Preencha o cadastro do estudante.");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W = doc.internal.pageSize.getWidth(), M = 20, TW = W - 2*M;
  let y = cabecalho(doc) + 6;

  doc.setFontSize(12); doc.text("TERMO DE MATRÍCULA NO AEE", W/2, y, {align:"center"}); y += 12;

  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  const p1 = `Eu, ${sub(d.responsavel)} responsável pelo/a estudante ${d.nome}, regularmente matriculado na Escola ${sub(d.escola)}, série/ano ${sub(d.serie)} do Ensino ${sub(d.ensino)}, turma ${sub(d.turma)} turno ${sub(d.turno)},`;
  let l = doc.splitTextToSize(p1, TW); doc.text(l, M, y, {align:"justify", maxWidth:TW}); y += l.length*5.2 + 2;

  const p2 = "DECLARO que foi disponibilizado ao mesmo (a) o serviço complementar/suplementar de Atendimento Educacional Especializado que será no contraturno. Reconheço que esse serviço é um direito prescrito no Art. 208, III da Constituição Federal/88; Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva /2008; Resolução no. 04/2009; Decreto no. 7.611/09/2011; afirmando que esse atendimento complementa e/ou suplementa a formação dos alunos com vistas à autonomia e independência na escola e fora dela, favorecendo o processo de inclusão escolar.";
  l = doc.splitTextToSize(p2, TW); doc.text(l, M, y, {align:"justify", maxWidth:TW}); y += l.length*5.2 + 4;

  doc.setFont("helvetica","bold"); doc.text("Assim sendo:", M, y); y += 5;
  doc.setFont("helvetica","normal");

  // Caixa 1
  const aceita = d.opcaoTermo==="aceita";
  doc.rect(M, y, TW, 36);
  let by = y + 6;
  doc.text("Comprometo-me em trazer o (a) estudante, pelo (a) qual sou responsável, nos dias e horários abaixo estipulados.", M+2, by, {maxWidth:TW-4}); by += 11;
  const dias = DIAS.map(x => `${x} ( ${aceita && d.dias.includes(x) ? "X" : " "} )`).join("     ");
  doc.text("Dias da Semana:   " + dias, M+2, by); by += 8;
  doc.text("Horário: " + (aceita && d.horario ? d.horario : "_______________________"), M+2, by); by += 8;
  doc.text("Assinatura do responsável: ______________________________________________", M+2, by);
  y += 44;

  // Caixa 2
  doc.rect(M, y, TW, 36);
  by = y + 6;
  doc.setFont("helvetica","bold"); doc.text("Dispenso", M+2, by);
  doc.setFont("helvetica","normal");
  doc.text(" o serviço de Atendimento Educacional Especializado, no contraturno da Escola, oferecido", M+2+doc.getTextWidth("Dispenso"), by);
  by += 5; doc.text("ao estudante, pelo (a) qual sou responsável, pelos seguintes motivos.", M+2, by); by += 7;
  const mot = !aceita && d.motivo ? doc.splitTextToSize(d.motivo, TW-4).slice(0,2) : ["______________________________________________________________________","______________________________________________________________________"];
  mot.forEach(t=>{ doc.text(t, M+2, by); by += 6; });
  doc.text("Assinatura do Responsável: ______________________________________________", M+2, by+2);
  y += 48;

  // Data e diretor
  let dt = "______ de __________________ de 20______";
  if(d.dataTermo){ const [yy,mm,dd]=d.dataTermo.split("-"); dt = `${dd} de ${MESES[+mm-1]} de ${yy}`; }
  doc.text(`${d.cidadeAssin || "_______________________"}, ${dt}`, W/2, y, {align:"center"}); y += 22;
  doc.line(W/2-45, y, W/2+45, y); y += 5;
  doc.text(d.diretor || "", W/2, y, {align:"center"}); y += 5;
  doc.text("Assinatura e Carimbo do Diretor(a) da Unidade de Ensino", W/2, y, {align:"center"});

  doc.save(`Termo_AEE_${d.nome.replace(/\s+/g,"_")}.pdf`);
}
atualizarLista();
</script>
</body>
</html>
